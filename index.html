<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodLoop AI</title>
<style>
html,body{margin:0;height:100%;background:#f4f7f8}
#loading{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#13384a;padding:24px}
</style>
</head>
<body>
<div id="loading">Loading FoodLoop AI…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/Long2812/foodloop-ai/main/foodloop-v14.gz?cachebust=20260830';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('App payload unavailable: '+res.status);
    const raw=new Uint8Array(await res.arrayBuffer());
    const isGzip=raw.length>=2 && raw[0]===0x1f && raw[1]===0x8b;
    let bytes=raw;
    if(isGzip){
      const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    }
    const html=new TextDecoder('utf-8').decode(bytes);
    if(!html.includes('<!doctype html>') && !html.includes('<html')) throw new Error('Invalid FoodLoop payload');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Unable to load FoodLoop AI. Please refresh.';
    console.error('FoodLoop loader:',e);
  }
})();
</script>
</body>
</html>
