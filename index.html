<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodLoop AI</title><style>body{margin:0;font:15px system-ui;background:#f4f7f8;color:#18333f}.app{display:flex;min-height:100vh}aside{width:240px;background:white;padding:20px;border-right:1px solid #dbe4e8}button{font:inherit;cursor:pointer}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px;border-radius:9px;margin:3px 0}nav button:hover,nav button.active{background:#eaf1f4;font-weight:700}main{flex:1}.top{background:#fff;padding:18px 30px;border-bottom:1px solid #dbe4e8}.content{padding:25px;max-width:1200px;margin:auto}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid #dbe4e8;border-radius:14px;padding:18px}.k{color:#71808a;font-size:12px}.v{font-size:28px;font-weight:800;margin:7px 0}.danger{color:#b5483d}.green{color:#2f765b}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#dcefe6;color:#2f765b;font-size:12px;font-weight:700}.actions button{margin:5px;padding:10px;border:1px solid #ccd8de;border-radius:9px;background:#fff}.actions button.active{background:#13384a;color:#fff}.ok{color:#2f765b;font-weight:700}.warn{color:#a87508;font-weight:700}@media(max-width:800px){aside{display:none}.four,.two{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><h2>FoodLoop AI</h2><p class="k">School food decision intelligence</p><nav><button class="active" onclick="show('dashboard',this)">Dashboard</button><button onclick="show('voice',this)">Student Voice</button><button onclick="show('insights',this)">Waste & Insights</button><button onclick="show('simulator',this)">Before-Serving Simulator</button><button onclick="show('experiments',this)">Experiments</button></nav><hr><small>The loop is the product.<br>Listen → Understand → Simulate → Experiment → Learn</small></aside><main><div class="top"><b id="title">Dashboard</b><div class="k" id="sub">Today’s signals and decisions</div></div><div class="content" id="view"></div></main></div><script>const pages={dashboard:['Dashboard','Today’s signals and decisions',`<div class="grid four"><div class="card"><div class="k">Projected food waste</div><div class="v danger">12.0%</div><small>Tomorrow · illustrative demo data</small></div><div class="card"><div class="k">Student acceptance</div><div class="v">84%</div><small class="green">+6 pts vs last week</small></div><div class="card"><div class="k">Nutrition balance</div><div class="v">91</div><small>Guardrail threshold: 90</small></div><div class="card"><div class="k">Open experiments</div><div class="v">1</div><small>Greens portion trial</small></div></div><h3>What needs attention</h3><div class="grid two"><div class="card"><b>Pasta waste is recurring</b><p>Returned-food data and Student Voice point to sauce taste as a likely cause.</p><button onclick="show('simulator')">Open simulator</button></div><div class="card"><b>FoodLoop recommendation</b><p>Compare a sauce change before changing tomorrow’s full menu. Nutrition remains a guardrail.</p></div></div>`],voice:['Student Voice','Listen before changing the meal',`<div class="grid two"><div class="card"><h3>Today’s meal feedback</h3><p>Pasta + greens</p><div class="actions"><button onclick="vote('Liked')">Liked</button><button onclick="vote('Okay')">Okay</button><button onclick="vote('Did not like')">Did not like</button></div><p id="vote"></p></div><div class="card"><h3>What students are saying</h3><p>75% want portion options</p><p>60% report portions can be too large</p><p>45% often leave rice · 40% often leave vegetables</p><small>Prototype survey signals; not population estimates.</small></div></div>`],insights:['Waste & Insights','Find likely causes, not just totals',`<div class="grid two"><div class="card"><h3>Recent signals</h3><p>Pasta + greens — <b class="danger">14.4% returned</b></p><p>Rice + chicken — 11.1%</p><p>Vegetable soup — <span class="green">6.8%</span></p></div><div class="card"><h3>Root-cause hypothesis</h3><p>Observed waste + Student Voice suggest sauce taste as a likely cause.</p><p><b>Next question:</b> Can a recipe change reduce returns without increasing cost or weakening nutrition?</p></div></div>`],simulator:['Before-Serving Simulator','Compare options before service',`<div class="card"><h3>Pasta + greens · 720 expected students</h3><div class="actions"><button class="active" onclick="scenario('portion')">Portion</button><button onclick="scenario('recipe')">Recipe</button><button onclick="scenario('prep')">Preparation</button><button onclick="scenario('serving')">Serving</button></div><div class="grid two"><div class="card"><div class="k">Current plan</div><div class="v">12.0%</div>Projected waste<br>Acceptance 84% · Nutrition 91</div><div class="card"><div class="k">Selected option</div><div class="v green" id="waste">9.7%</div>Projected waste<br>Acceptance <span id="acc">82%</span> · Nutrition <span id="nut">89</span><p id="decision" class="warn">Nutrition review required</p></div></div><h3 id="rec">Reduce regular portion by 10%</h3><p id="reason">Projected values are model outputs. Real results are measured in Experiments.</p></div>`],experiments:['Experiments','Small changes, measured outcomes',`<div class="grid two"><div class="card"><span class="pill">Completed</span><h3>EXP-014 · Pasta sauce</h3><p>Prototype scenario: waste 14.4% → <b class="green">8.6%</b></p><p>Acceptance 71% → <b class="green">87%</b></p><button onclick="alert('Results added to FoodLoop learning queue')">Add results to FoodLoop</button></div><div class="card"><h3>The learning loop</h3><p>Measure → understand → test → measure again → use evidence to improve the next recommendation.</p><small>Demo values are illustrative unless validated by a real pilot.</small></div></div>`]};function show(k,b){let p=pages[k];title.textContent=p[0];sub.textContent=p[1];view.innerHTML=p[2];document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}function vote(x){document.getElementById('vote').textContent='Preference recorded: '+x}function scenario(x){let d={portion:['9.7%','82%','89','Reduce regular portion by 10%','Nutrition review required'],recipe:['8.9%','84%','92','Change pasta sauce recipe','Ready for experiment'],prep:['9.4%','83%','93','Adjust preparation method','Ready for experiment'],serving:['8.6%','85%','92','Serve sauce separately','Ready for experiment']}[x];waste.textContent=d[0];acc.textContent=d[1];nut.textContent=d[2];rec.textContent=d[3];decision.textContent=d[4];decision.className=d[2]>=90?'ok':'warn'}show('dashboard')</script></body></html>
