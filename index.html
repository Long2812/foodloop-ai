<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodLoop AI</title><style>html,body{margin:0;height:100%;background:#f4f7f8}#loading{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#13384a;padding:24px}</style></head><body><div id="loading">Loading FoodLoop AI…</div><script>(async()=>{try{const res=await fetch('./foodloop-v14.bin?cb=3',{cache:'no-store'});if(!res.ok)throw new Error('App payload unavailable: '+res.status);const raw=new Uint8Array(await res.arrayBuffer());const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const bytes=new Uint8Array(await new Response(stream).arrayBuffer());const html=new TextDecoder('utf-8').decode(bytes);if(!html.includes('<!doctype html>')&&!html.includes('<html'))throw new Error('Invalid FoodLoop payload');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').textContent='Unable to load FoodLoop AI. '+e.message;console.error('FoodLoop loader:',e)}})();</script></body></html>
