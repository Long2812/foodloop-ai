<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodLoop AI</title>
<style>
html,body{margin:0;height:100%;background:#f4f7f8}
#loading{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#13384a;padding:24px}
</style>
</head>
<body>
<div id="loading">Loading FoodLoop AI…</div>
<script>
(async()=>{
  try{
    const res=await fetch('https://raw.githubusercontent.com/Long2812/foodloop-ai/main/foodloop-v14.gz?rev=1',{cache:'no-store'});
    if(!res.ok) throw new Error('App payload unavailable');
    const stream=res.body.pipeThrough(new DecompressionStream('gzip'));
    const bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Unable to load FoodLoop AI. Please refresh.';
    console.error(e);
  }
})();
</script>
</body>
</html>
